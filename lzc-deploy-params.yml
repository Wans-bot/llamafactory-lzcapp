# 可选 HTTP 代理：如需下载模型/数据集但所在网络无法直连 hf-mirror.com，
# 可填写 HTTP/HTTPS 代理地址，应用的所有外呼请求将经由该代理。留空为直连。
#
# 所有参数均为可选时安装界面会直接跳过；安装后也可在客户端的
# 「应用 → 配置/重新配置」中修改本参数。
params:
  - id: http_proxy
    type: string
    name: "HTTP 代理（可选）"
    description: "如所在网络无法直连 hf-mirror.com（下载模型/数据集用），可填写 HTTP/HTTPS 代理地址，例如 http://192.168.1.2:7890。留空为直连。"
    default_value: ""
    optional: true
